<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Support Chat has moved | Beat Saber Modding Wiki</title>
  <link rel="shortcut icon" href="/assets/logo.png" />
</head>
<body>
  <p>Support Chat has moved. <a id="support-link" href="/support/">Continue to Support Chat</a>.</p>
  <p><a href="/">Return to the wiki</a>.</p>
  <script>
    const destination = new URL("/support/", location.href);
    destination.search = location.search;
    destination.hash = location.hash;
    if (destination.protocol === "http:" && destination.hostname.endsWith("sm0ke.org")) {
      destination.protocol = "https:";
    }
    document.getElementById("support-link").href = destination.href;
    location.replace(destination.href);
  </script>
</body>
</html>
