<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support Chat | Beat Saber Modding Wiki</title>
  <meta name="robots" content="noindex" />
  <link rel="shortcut icon" href="/assets/logo.png" />
  <link rel="stylesheet" href="/support/chat.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NDRRR0YEW9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-NDRRR0YEW9");
  </script>
  <!-- HTTPS redirect -->
  <script>
    if (location.protocol === "http:" && (location.hostname === "sm0ke.org" || location.hostname.endsWith(".sm0ke.org"))) {
      location.replace("https://" + location.host + location.pathname + location.search + location.hash);
    }
  </script>
</head>
<body class="support-page">

  <!-- ── Nav bar ───────────────────────────────────────────────────────── -->
  <header class="support-nav">
    <a href="/" class="support-nav-back">← Wiki</a>
    <a href="/" class="support-nav-title">
      <img src="/assets/logo.png" alt="BSS Wiki logo" />
      <span>BSS Wiki</span>
    </a>
    <div class="support-nav-status">
      <button class="notification-button" id="notification-button" type="button" hidden>Notify me</button>
      <span class="status-pill status-warn" id="status-pill">Connecting</span>
    </div>
  </header>

  <!-- ── Chat shell ─────────────────────────────────────────────────────── -->
  <div class="support-chat-root">
    <section class="chat-shell">
      <div class="chat-status">
        <div class="chat-id">Chat ID <span id="chat-id"></span></div>
        <div class="status-block">
          <span class="status-pill status-warn presence-pill" id="presence-pill" role="status">Checking support…</span>
        </div>
      </div>

      <div class="chat-log" id="chat-log">
        <div class="empty-state" id="empty-state">
          <h1>What can we help with?</h1>
          <p>Describe what went wrong and what you have already tried. A screenshot usually helps.</p>
          <div class="starter-prompts" aria-label="Suggested messages">
            <button type="button" data-prompt="I need help modding Beat Saber on Quest. ">Quest modding</button>
            <button type="button" data-prompt="Beat Saber is crashing. Here is what happens: ">Game crash</button>
            <button type="button" data-prompt="A mod is not working. The mod and game versions are: ">Broken mod</button>
          </div>
        </div>
      </div>

      <footer class="chat-input">
        <div class="input-wrap">
          <div class="input-field">
            <button class="tool-btn inline" id="tool-image" type="button" title="Upload image" aria-label="Upload image">+</button>
            <textarea id="message-input" rows="2" placeholder="Describe the problem…" aria-label="Message"></textarea>
          </div>
          <div class="input-hint" id="input-hint">Shift + Enter for a new line.</div>
        </div>
        <button class="send-button" id="send-button" type="button" aria-label="Send message" title="Send message">›</button>
      </footer>
    </section>
  </div>

  <input id="imgur-input" type="file" accept="image/*" hidden />

  <!-- ── Chat logic ─────────────────────────────────────────────────────── -->
  <script>
  (function initSupportChat() {
    const ui = {
      log: document.getElementById("chat-log"),
      input: document.getElementById("message-input"),
      send: document.getElementById("send-button"),
      status: document.getElementById("status-pill"),
      presence: document.getElementById("presence-pill"),
      chatId: document.getElementById("chat-id"),
      empty: document.getElementById("empty-state"),
      toolImage: document.getElementById("tool-image"),
      hint: document.getElementById("input-hint"),
      imgurInput: document.getElementById("imgur-input"),
      notification: document.getElementById("notification-button"),
    };

    const CHAT_API_BASE = "https://bsm-api.sm0ke.org";
    const UPLOAD_API_PATH = "/api/uploads";
    const POLL_INTERVAL_MS = 4000;
    const POLL_IDLE_MS = 12000;
    const PRESENCE_INTERVAL_MS = 30000;
    const STORAGE_KEYS = {
      userId: "supportChatUserId",
      token: "supportChatToken",
      notifyAsked: "supportChatNotifyAsked",
    };

    const state = {
      userId: getOrCreateUserId(),
      conversationId: null,
      clientToken: localStorage.getItem(STORAGE_KEYS.token) || "",
      displayName: "",
      lastMessageAt: 0,
      syncCursor: null,
      revisions: new Map(),
      sending: false,
      uploading: false,
      draftRevision: 0,
      renderedIds: new Set(),
      lastDayKey: "",
      messageMap: new Map(),
      notifiedIds: new Set(),
    };
    const analyticsState = { opened: false, historyTracked: false, transportMode: "none" };

    const defaultHint = "Shift + Enter for a new line.";
    const TEXTAREA_MIN_HEIGHT = 48;
    const TEXTAREA_MAX_HEIGHT = 140;

    state.conversationId = state.userId;
    state.displayName = `Guest (${state.userId})`;
    ui.chatId.textContent = state.userId;

    let markdownReady = false;
    let pollTimer = null;
    let idlePolls = 0;
    let eventSource = null;
    let notificationPrompted = false;
    let notificationSound = null;
    let presenceTimer = null;
    let hintTimer = null;
    let disposed = false;
    let lifecycle = 0;
    let requests = new AbortController();

    function getOrCreateUserId() {
      const existing = localStorage.getItem(STORAGE_KEYS.userId);
      if (existing) return existing;
      const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
      let r = "";
      for (let i = 0; i < 6; i++) r += chars[Math.floor(Math.random() * chars.length)];
      localStorage.setItem(STORAGE_KEYS.userId, r);
      return r;
    }

    function track(name, params = {}) {
      if (typeof window.gtag !== "function") return;
      const p = {};
      Object.keys(params).forEach(k => {
        const v = params[k];
        if (v === null || v === undefined) return;
        if (typeof v === "boolean") { p[k] = v ? 1 : 0; return; }
        if (typeof v === "number" && isFinite(v)) { p[k] = v; return; }
        const s = String(v).trim().slice(0, 100);
        if (s) p[k] = s;
      });
      window.gtag("event", name, p);
    }

    function messageMetrics(text) {
      const { cleanedText, images } = extractImageUrls(text || "");
      const trimmed = cleanedText.trim();
      return { charCount: trimmed.length, wordCount: trimmed ? trimmed.split(/\s+/).length : 0, imageCount: images.length, hasText: Boolean(trimmed) };
    }

    function setStatus(text, tone) {
      ui.status.textContent = text;
      ui.status.classList.remove("status-ok", "status-warn", "status-error");
      ui.status.classList.add(tone === "ok" ? "status-ok" : tone === "error" ? "status-error" : "status-warn");
    }

    function setHint(msg, tone) {
      if (disposed) return;
      clearTimeout(hintTimer);
      hintTimer = null;
      ui.hint.textContent = msg;
      ui.hint.classList.remove("warn", "error", "ok");
      if (tone) ui.hint.classList.add(tone);
    }

    function resetHint() { if (!disposed) setHint(defaultHint); }
    function resetHintLater() {
      if (disposed) return;
      clearTimeout(hintTimer);
      hintTimer = setTimeout(resetHint, 2500);
    }

    function setPresence(online) {
      ui.presence.classList.remove("status-ok", "status-warn", "status-error");
      ui.presence.classList.add(online === true ? "status-ok" : "status-warn");
      ui.presence.textContent = online === true ? "Support online" : online === false ? "Support offline" : "Support status unavailable";
    }

    async function refreshPresence() {
      const cycle = lifecycle;
      try {
        const data = await fetchJson(apiUrl("/api/presence"));
        if (disposed || cycle !== lifecycle) return;
        setPresence(typeof data.online === "boolean" ? data.online : null);
      } catch {
        if (disposed || cycle !== lifecycle) return;
        setPresence(null);
      } finally {
        if (!disposed && cycle === lifecycle) presenceTimer = setTimeout(refreshPresence, PRESENCE_INTERVAL_MS);
      }
    }

    function refreshComposer() {
      const busy = disposed || state.sending || state.uploading;
      ui.send.disabled = busy;
      ui.toolImage.disabled = busy;
      ui.input.disabled = disposed || state.uploading;
    }

    function changeDraft(value) {
      ui.input.value = value;
      state.draftRevision++;
      autoResizeTextarea();
    }

    function preserveImageLinks(links) {
      const missing = links.filter(link => !ui.input.value.includes(link));
      if (missing.length) changeDraft([ui.input.value, ...missing].filter(Boolean).join(" "));
    }

    async function attemptNotificationPrompt(force = false) {
      if (!("Notification" in window)) return false;
      if (Notification.permission === "granted") return true;
      if (Notification.permission === "denied") return false;
      const asked = localStorage.getItem(STORAGE_KEYS.notifyAsked) === "true";
      if (!force && (notificationPrompted || asked)) return false;
      notificationPrompted = true;
      localStorage.setItem(STORAGE_KEYS.notifyAsked, "true");
      try {
        const perm = await Notification.requestPermission();
        track("support_chat_notification_permission", { permission: perm, prompt_mode: force ? "forced" : "automatic" });
        if (perm === "default") { notificationPrompted = false; localStorage.removeItem(STORAGE_KEYS.notifyAsked); }
        ui.notification.hidden = perm !== "default";
        return perm === "granted";
      } catch { return false; }
    }

    function refreshNotificationButton() {
      ui.notification.hidden = !("Notification" in window) || Notification.permission !== "default";
    }

    function playNotificationSound() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!notificationSound) notificationSound = new Ctx();
      const ctx = notificationSound;
      const play = () => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine"; osc.frequency.value = 880; gain.gain.value = 0.08;
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.2);
      };
      if (ctx.state === "suspended") { ctx.resume().then(play).catch(() => {}); } else { play(); }
    }

    function autoResizeTextarea() {
      ui.input.style.height = "auto";
      ui.input.style.height = Math.max(Math.min(ui.input.scrollHeight, TEXTAREA_MAX_HEIGHT), TEXTAREA_MIN_HEIGHT) + "px";
    }

    function apiUrl(path) { return CHAT_API_BASE.replace(/\/+$/, "") + path; }

    async function fetchJson(url, options = {}) {
      if (disposed) throw new DOMException("Page closed", "AbortError");
      const signal = requests.signal;
      const cycle = lifecycle;
      const res = await fetch(url, { ...options, signal });
      const text = await res.text();
      if (signal.aborted || disposed || cycle !== lifecycle) throw new DOMException("Page closed", "AbortError");
      let data;
      try { data = JSON.parse(text); } catch {}
      if (!res.ok) throw new Error(data?.error || res.statusText || "Request failed");
      if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("Invalid server response");
      return data;
    }

    function renderMarkdown(text) {
      if (!window.marked || !window.DOMPurify) return { html: text, isHtml: false };
      if (!markdownReady) { window.marked.setOptions({ breaks: true, gfm: true }); markdownReady = true; }
      const dirty = window.marked.parse(text.replace(/(^|\n)-#\s?(.*?)(?=\n|$)/g, (m, p, c) => c.trim() ? `${p}<small>${c.trim()}</small>` : m));
      return { html: window.DOMPurify.sanitize(dirty, { ADD_TAGS: ["small"] }), isHtml: true };
    }

    function formatTime(ts) { return ts ? new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : ""; }
    function dayKey(ts) { return ts ? new Date(ts).toDateString() : ""; }
    function formatDayLabel(ts) {
      if (!ts) return "";
      const d = new Date(ts), now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const yesterday = new Date(today.getTime() - 86400000);
      if (d >= today) return "Today";
      if (d >= yesterday) return "Yesterday";
      return d.toLocaleDateString();
    }

    function appendDayDivider(ts) {
      const div = document.createElement("div"); div.className = "day-divider";
      const span = document.createElement("span"); span.textContent = formatDayLabel(ts);
      div.appendChild(span); ui.log.appendChild(div);
    }

    function extractImageUrls(text) {
      const regex = /https?:\/\/(?:i\.|cdn\.)?allthepics\.net\/[^\s]+?\.(?:png|jpe?g|gif|webp)(?:\?[^\s]+)?/g;
      const matches = text.match(regex) || [];
      let cleaned = text;
      matches.forEach(url => { cleaned = cleaned.replace(url, "").trim(); });
      return { cleanedText: cleaned, images: matches };
    }

    function buildMessageActions(message) {
      if (message.role !== "user" || message.senderId !== state.userId) return null;
      const actions = document.createElement("div"); actions.className = "message-actions";
      const edit = document.createElement("button"); edit.type = "button"; edit.className = "message-action"; edit.textContent = "Edit";
      edit.addEventListener("click", () => handleEditMessage(message));
      const del = document.createElement("button"); del.type = "button"; del.className = "message-action"; del.textContent = "Delete";
      del.addEventListener("click", () => handleDeleteMessage(message));
      actions.appendChild(edit); actions.appendChild(del);
      return actions;
    }

    function buildMessageElement(message) {
      const role = message.role === "support" ? "support" : message.role === "system" ? "system" : "user";
      const wrapper = document.createElement("div"); wrapper.className = `message ${role}`; wrapper.dataset.id = message.id || "";
      const bubble = document.createElement("div"); bubble.className = "bubble";
      const { cleanedText, images } = extractImageUrls(message.text || "");
      if (cleanedText) {
        const body = document.createElement("div"); body.className = "body";
        const rendered = renderMarkdown(cleanedText);
        if (rendered.isHtml) body.innerHTML = rendered.html; else body.textContent = rendered.html;
        bubble.appendChild(body);
      }
      if (images.length) {
        const grid = document.createElement("div"); grid.className = "image-grid";
        images.forEach(url => {
          const img = document.createElement("img"); img.src = url; img.alt = "Uploaded image"; img.loading = "lazy";
          grid.appendChild(img);
        });
        bubble.appendChild(grid);
      }
      const time = document.createElement("div"); time.className = "time"; time.textContent = formatTime(message.createdAt);
      bubble.appendChild(time);
      wrapper.appendChild(bubble);
      const actions = buildMessageActions(message);
      if (actions) wrapper.appendChild(actions);
      return wrapper;
    }

    function updateEmptyState() {
      const hasMessages = state.renderedIds.size > 0;
      if (!hasMessages && !ui.empty.isConnected) ui.log.appendChild(ui.empty);
      ui.empty.style.display = hasMessages ? "none" : "block";
    }
    function isNearBottom() { return (ui.log.scrollHeight - ui.log.scrollTop - ui.log.clientHeight) < 120; }
    function scrollToBottom() { ui.log.scrollTop = ui.log.scrollHeight; }

    function renderMessages(messages, forceScroll) {
      // Merge history too: a delayed initial GET must not erase a just-sent message.
      appendMessages(messages, forceScroll, 0);
      if (!analyticsState.historyTracked) {
        analyticsState.historyTracked = true;
        const s = summarizeMessages(messages);
        track("support_chat_history_loaded", { total_count: s.totalCount, support_count: s.supportCount, system_count: s.systemCount, user_count: s.userCount, image_message_count: s.imageMessageCount, text_message_count: s.textMessageCount });
      }
    }

    function refreshMessageLog(forceScroll) {
      const nearBottom = isNearBottom();
      const offset = ui.log.scrollHeight - ui.log.scrollTop;
      ui.log.replaceChildren(ui.empty);
      state.lastDayKey = "";
      const messages = [...state.messageMap.values()].sort((a, b) =>
        (a.createdAt || 0) - (b.createdAt || 0) || (a.createdSeq || 0) - (b.createdSeq || 0)
      );
      for (const message of messages) {
        const key = dayKey(message.createdAt);
        if (key && key !== state.lastDayKey) { appendDayDivider(message.createdAt); state.lastDayKey = key; }
        ui.log.appendChild(buildMessageElement(message));
      }
      updateEmptyState();
      if (forceScroll || nearBottom) scrollToBottom();
      else ui.log.scrollTop = Math.max(0, ui.log.scrollHeight - offset);
    }

    function summarizeMessages(messages) {
      const s = { totalCount: 0, supportCount: 0, systemCount: 0, userCount: 0, imageMessageCount: 0, textMessageCount: 0 };
      (messages || []).forEach(m => {
        if (!m || !m.id || m.deleted || m.deletedAt) return;
        s.totalCount++;
        if (m.role === "support") s.supportCount++; else if (m.role === "system") s.systemCount++; else s.userCount++;
        const met = messageMetrics(m.text || "");
        if (met.imageCount) s.imageMessageCount++;
        if (met.hasText) s.textMessageCount++;
      });
      return s;
    }

    function appendMessages(messages, forceScroll, prevLast = 0) {
      if (!Array.isArray(messages)) return;
      let changed = false;
      const newIncoming = [];
      for (const message of messages) {
        if (!message || !message.id) continue;
        const revision = Number(message.changeSeq) || Math.max(message.editedAt || 0, message.deletedAt || 0, message.createdAt || 0);
        const known = state.revisions.has(message.id);
        if (known && revision <= state.revisions.get(message.id)) continue;
        // Keep tombstone revisions so a delayed poll cannot resurrect a deletion.
        state.revisions.set(message.id, revision);
        if (message.deleted || message.deletedAt) {
          state.renderedIds.delete(message.id);
          state.messageMap.delete(message.id);
        } else {
          state.renderedIds.add(message.id);
          state.messageMap.set(message.id, message);
          state.lastMessageAt = Math.max(state.lastMessageAt, message.createdAt || 0);
          if (!known && shouldNotify(message, prevLast)) { state.notifiedIds.add(message.id); notifyMessage(message); }
          if (!known && prevLast && (message.createdAt || 0) > prevLast && message.role !== "user") newIncoming.push(message);
        }
        changed = true;
      }
      if (changed) refreshMessageLog(forceScroll);
      else updateEmptyState();
      if (newIncoming.length) {
        const s = summarizeMessages(newIncoming);
        track("support_chat_messages_received", { batch_count: s.totalCount, support_count: s.supportCount, system_count: s.systemCount, image_message_count: s.imageMessageCount, text_message_count: s.textMessageCount, transport_mode: analyticsState.transportMode });
      }
    }

    function acceptCursor(payload) {
      if (Number.isSafeInteger(payload.cursor) && payload.cursor >= 0) {
        state.syncCursor = Math.max(state.syncCursor || 0, payload.cursor);
      }
    }

    async function ensureClientToken() {
      const saved = localStorage.getItem(STORAGE_KEYS.token);
      if (saved) { state.clientToken = saved; return; }
      // A tokenless GET succeeds only for a conversation that does not exist.
      // Never replace credentials for existing tokenless history on a 403.
      const params = new URLSearchParams({ conversationId: state.conversationId });
      await fetchJson(apiUrl(`/api/messages?${params}`));
      const token = localStorage.getItem(STORAGE_KEYS.token) || Array.from(
        crypto.getRandomValues(new Uint8Array(32)), byte => byte.toString(16).padStart(2, "0")
      ).join("");
      // Persist before creation: losing the POST response must not lose access.
      localStorage.setItem(STORAGE_KEYS.token, token);
      state.clientToken = token;
    }

    async function postMessage(text, role) {
      if (!state.clientToken) await ensureClientToken();
      const headers = { "Content-Type": "application/json" };
      if (state.clientToken) headers["X-Client-Token"] = state.clientToken;
      const data = await fetchJson(apiUrl("/api/messages"), {
        method: "POST", headers,
        body: JSON.stringify({ conversationId: state.conversationId, senderId: state.userId, senderName: state.displayName, text, role, clientToken: state.clientToken }),
      });
      if (!data.message || typeof data.message.id !== "string" || !data.message.id || typeof data.message.text !== "string") {
        throw new Error("Message was not acknowledged");
      }
      if (data.clientToken && typeof data.clientToken !== "string") throw new Error("Invalid client token");
      if (data.clientToken && data.clientToken !== state.clientToken) {
        state.clientToken = data.clientToken;
        localStorage.setItem(STORAGE_KEYS.token, data.clientToken);
      }
      return data;
    }

    async function updateMessage(messageId, text) {
      const headers = { "Content-Type": "application/json" };
      if (state.clientToken) headers["X-Client-Token"] = state.clientToken;
      const data = await fetchJson(apiUrl("/api/messages"), {
        method: "PATCH", headers,
        body: JSON.stringify({ conversationId: state.conversationId, messageId, text, senderId: state.userId, clientToken: state.clientToken }),
      });
      if (!disposed && data && data.message) appendMessages([data.message], false);
    }

    async function deleteMessage(messageId) {
      const headers = { "Content-Type": "application/json" };
      if (state.clientToken) headers["X-Client-Token"] = state.clientToken;
      const data = await fetchJson(apiUrl("/api/messages"), {
        method: "DELETE", headers,
        body: JSON.stringify({ conversationId: state.conversationId, messageId, senderId: state.userId, clientToken: state.clientToken }),
      });
      if (disposed) return;
      if (data && data.message) appendMessages([data.message], false);
      else {
        state.renderedIds.delete(messageId);
        state.messageMap.delete(messageId);
        refreshMessageLog(false);
      }
    }

    async function handleEditMessage(message) {
      if (disposed) return;
      const cycle = lifecycle;
      const current = message.text || "";
      const next = window.prompt("Edit message:", current);
      if (next === null) return;
      const trimmed = next.trim();
      if (!trimmed || trimmed === current) return;
      setHint("Saving edit...", "warn");
      try {
        await updateMessage(message.id, trimmed);
        if (disposed || cycle !== lifecycle) return;
        track("support_chat_message_edit", { before_char_count: current.trim().length, after_char_count: trimmed.length, success: true });
        setHint("Message updated.", "ok");
      } catch {
        if (disposed || cycle !== lifecycle) return;
        track("support_chat_message_edit", { before_char_count: current.trim().length, after_char_count: trimmed.length, success: false });
        setHint("Edit failed.", "error");
      } finally { if (!disposed && cycle === lifecycle) resetHintLater(); }
    }

    async function handleDeleteMessage(message) {
      if (disposed) return;
      const cycle = lifecycle;
      if (!window.confirm("Delete this message?")) return;
      setHint("Deleting message...", "warn");
      try {
        await deleteMessage(message.id);
        if (disposed || cycle !== lifecycle) return;
        track("support_chat_message_delete", { success: true });
        setHint("Message deleted.", "ok");
      } catch {
        if (disposed || cycle !== lifecycle) return;
        track("support_chat_message_delete", { success: false });
        setHint("Delete failed.", "error");
      } finally { if (!disposed && cycle === lifecycle) resetHintLater(); }
    }

    async function loadMessages({ incremental = false } = {}) {
      const cycle = lifecycle;
      let more = true;
      while (more && !disposed && cycle === lifecycle) {
        const params = new URLSearchParams({ conversationId: state.conversationId });
        if (state.clientToken) params.set("token", state.clientToken);
        const requestedCursor = state.syncCursor || 0;
        if (incremental) params.set("cursor", String(requestedCursor));
        const data = await fetchJson(apiUrl(`/api/messages?${params}`));
        if (disposed || cycle !== lifecycle) return;
        if (incremental) appendMessages(data.messages || [], false, state.lastMessageAt);
        else renderMessages(data.messages || [], false);
        acceptCursor(data);
        idlePolls = (data.messages && data.messages.length) ? 0 : Math.min(idlePolls + 1, 5);
        more = data.hasMore === true;
        if (more && state.syncCursor <= requestedCursor) throw new Error("Message cursor did not advance");
        incremental = true;
      }
    }

    function shouldNotify(message, prev) {
      if (!message || message.role === "user" || message.deleted || message.deletedAt) return false;
      if (!prev || message.createdAt <= prev) return false;
      if (state.notifiedIds.has(message.id)) return false;
      if (document.hasFocus()) return false;
      return true;
    }

    function notifyMessage(message) {
      if ("Notification" in window && Notification.permission === "granted") {
        const n = new Notification("Support reply", { body: (message.text || "").slice(0, 160) });
        n.onclick = () => window.focus();
        return;
      }
      playNotificationSound();
    }

    async function handleSend() {
      if (disposed || state.sending || state.uploading) return;
      const snapshot = ui.input.value;
      const revision = state.draftRevision;
      const text = snapshot.trim();
      if (!text) return;
      const cycle = lifecycle;
      const metrics = messageMetrics(text);
      state.sending = true;
      refreshComposer();
      try {
        const data = await postMessage(text, "user");
        if (disposed || cycle !== lifecycle) return;
        if (ui.input.value === snapshot && state.draftRevision === revision) changeDraft("");
        if (data && data.message) appendMessages([data.message], true, state.lastMessageAt);
        if (!eventSource && state.clientToken) startStream();
        track("support_chat_message_send", { message_type: metrics.imageCount ? (metrics.hasText ? "mixed" : "image") : "text", char_count: metrics.charCount, word_count: metrics.wordCount, image_count: metrics.imageCount, success: true });
        resetHint();
        setStatus("Online", "ok");
      } catch {
        if (disposed || cycle !== lifecycle) return;
        track("support_chat_message_send", { message_type: "text", char_count: metrics.charCount, word_count: metrics.wordCount, success: false });
        setStatus("Send failed", "error");
        setHint("Send failed. Your draft is ready to retry.", "error");
      } finally {
        if (cycle === lifecycle) { state.sending = false; refreshComposer(); }
      }
    }

    async function sendImageMessage(urls) {
      // Let the upload flow handle failures, preserving the uploaded URL for retry.
      const data = await postMessage(urls, "user");
      if (disposed) return;
      if (data && data.message) appendMessages([data.message], true, state.lastMessageAt);
      if (!eventSource && state.clientToken) startStream();
      track("support_chat_message_send", { message_type: "image", success: true });
    }

    async function uploadImage(file) {
      const fd = new FormData(); fd.append("source", file);
      const data = await fetchJson(apiUrl(UPLOAD_API_PATH), { method: "POST", body: fd });
      const link = data?.url || data?.image?.url || data?.image?.display_url || data?.data?.url || data?.data?.link;
      if (!link) throw new Error("Upload failed");
      return link;
    }

    async function handleImageUpload() {
      if (disposed || state.sending || state.uploading) return;
      const files = Array.from(ui.imgurInput.files || []);
      ui.imgurInput.value = "";
      if (!files.length) return;
      const cycle = lifecycle;
      const links = [];
      let sendingImage = false;
      state.uploading = true;
      refreshComposer();
      track("support_chat_image_upload_start", { file_count: files.length, draft_text_present: Boolean(ui.input.value.trim()) });
      setHint("Uploading image...", "warn");
      try {
        for (const file of files) {
          links.push(await uploadImage(file));
          if (disposed || cycle !== lifecycle) return;
        }
        if (ui.input.value.trim()) {
          preserveImageLinks(links);
          setHint("Image added.", "ok");
          track("support_chat_image_upload_complete", { file_count: files.length, delivery: "draft", success: true });
        } else {
          sendingImage = true;
          // Keep the uploaded URL visible until delivery succeeds, including if
          // navigation interrupts the POST and this page is restored from cache.
          preserveImageLinks(links);
          const snapshot = ui.input.value;
          const revision = state.draftRevision;
          await sendImageMessage(links.join(" "));
          if (disposed || cycle !== lifecycle) return;
          if (ui.input.value === snapshot && state.draftRevision === revision) changeDraft("");
          setHint("Image sent.", "ok");
          track("support_chat_image_upload_complete", { file_count: files.length, delivery: "sent", success: true });
        }
        resetHintLater();
      } catch {
        if (disposed || cycle !== lifecycle) return;
        preserveImageLinks(links);
        track("support_chat_image_upload_complete", { file_count: files.length, success: false });
        if (sendingImage) {
          track("support_chat_message_send", { message_type: "image", success: false });
          setHint("Image uploaded, but send failed. Press Send to retry.", "error");
        } else {
          setHint(links.length ? "Image upload failed. Already uploaded images are in your draft." : "Image upload failed. Choose the image to retry.", "error");
        }
      } finally {
        if (cycle === lifecycle) { state.uploading = false; refreshComposer(); }
      }
    }

    function schedulePoll() {
      if (disposed || eventSource) return;
      if (analyticsState.transportMode !== "poll") {
        analyticsState.transportMode = "poll";
        track("support_chat_transport_mode", { mode: "poll", reason: "fallback" });
      }
      if (pollTimer) clearTimeout(pollTimer);
      const cycle = lifecycle;
      pollTimer = setTimeout(async () => {
        pollTimer = null;
        try {
          await loadMessages({ incremental: true });
          if (!disposed && cycle === lifecycle) setStatus("Online", "ok");
        } catch {
          if (!disposed && cycle === lifecycle) setStatus("Offline", "error");
        } finally {
          if (!disposed && cycle === lifecycle) schedulePoll();
        }
      }, idlePolls > 2 ? POLL_IDLE_MS : POLL_INTERVAL_MS);
    }

    function startStream() {
      if (disposed || !("EventSource" in window)) return false;
      if (eventSource) eventSource.close();
      analyticsState.transportMode = "sse";
      track("support_chat_transport_mode", { mode: "sse", reason: "preferred" });
      const params = new URLSearchParams({ conversationId: state.conversationId });
      if (state.clientToken) params.set("token", state.clientToken);
      params.set("cursor", String(state.syncCursor || 0));
      const stream = new EventSource(apiUrl(`/api/stream?${params}`));
      eventSource = stream;

      stream.addEventListener("messages", e => {
        if (disposed || eventSource !== stream) return;
        let payload = {};
        try { payload = JSON.parse(e.data || "{}"); } catch {}
        const msgs = payload.messages || [];
        if (msgs.length) appendMessages(msgs, false, state.lastMessageAt);
        acceptCursor(payload);
        setStatus("Online", "ok");
      });

      stream.onopen = () => {
        if (disposed || eventSource !== stream) return;
        track("support_chat_connection_state", { state: "online", transport_mode: "sse" });
        setStatus("Online", "ok");
        if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
      };

      stream.onerror = () => {
        if (disposed || eventSource !== stream) return;
        track("support_chat_connection_state", { state: "offline", transport_mode: "sse" });
        setStatus("Offline", "error");
        if (eventSource) { eventSource.close(); eventSource = null; }
        idlePolls = 0;
        schedulePoll();
      };

      return true;
    }

    async function bootstrap() {
      const cycle = lifecycle;
      refreshPresence();
      if (!analyticsState.opened) {
        analyticsState.opened = true;
        track("support_chat_open", { session_type: state.clientToken ? "returning" : "new" });
      }
      setStatus("Connecting", "warn");
      try {
        await loadMessages({ incremental: state.syncCursor !== null });
        if (disposed || cycle !== lifecycle) return;
        setStatus("Online", "ok");
      } catch {
        if (disposed || cycle !== lifecycle) return;
        track("support_chat_bootstrap_error", { has_token: Boolean(state.clientToken) });
        setStatus("Offline", "error");
      }
      if (!state.clientToken || !startStream()) schedulePoll();
      refreshNotificationButton();
    }

    document.addEventListener("click", () => {
      if (notificationSound && notificationSound.state === "suspended") notificationSound.resume().catch(() => {});
    }, { once: true });

    ui.send.addEventListener("click", handleSend);
    ui.input.addEventListener("input", () => { state.draftRevision++; autoResizeTextarea(); });
    ui.input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); handleSend(); } });
    ui.toolImage.addEventListener("click", () => { if (!disposed && !state.sending && !state.uploading) ui.imgurInput.click(); });
    ui.imgurInput.addEventListener("change", handleImageUpload);
    ui.notification.addEventListener("click", () => attemptNotificationPrompt(true).catch(() => {}));
    ui.empty.addEventListener("click", e => {
      const button = e.target.closest("[data-prompt]");
      if (!button || disposed || state.uploading) return;
      changeDraft(button.dataset.prompt || "");
      ui.input.focus();
    });

    window.addEventListener("pagehide", () => {
      disposed = true;
      lifecycle++;
      requests.abort();
      clearTimeout(pollTimer);
      clearTimeout(presenceTimer);
      clearTimeout(hintTimer);
      pollTimer = presenceTimer = hintTimer = null;
      if (eventSource) { eventSource.close(); eventSource = null; }
      if (notificationSound) { notificationSound.close().catch(() => {}); notificationSound = null; }
      refreshComposer();
    });
    window.addEventListener("pageshow", e => {
      if (!e.persisted || !disposed) return;
      disposed = false;
      requests = new AbortController();
      state.sending = state.uploading = false;
      refreshComposer();
      bootstrap();
    });

    autoResizeTextarea();
    bootstrap();
  })();
  </script>

</body>
</html>
